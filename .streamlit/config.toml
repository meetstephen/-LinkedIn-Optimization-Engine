# ─────────────────────────────────────────────────────────────────
# Streamlit configuration — LinkedIn Optimization Engine
# ─────────────────────────────────────────────────────────────────

[theme]
base                     = "light"
primaryColor             = "#0A66C2"   # brand blue — buttons, links, highlights
backgroundColor          = "#F3F6FB"   # app background
secondaryBackgroundColor = "#EAF4FF"   # sidebar + input backgrounds
textColor                = "#111827"   # all body text
font                     = "sans serif"

[server]
# Bigger message ceiling — long AI streams disconnect on the default 200KB cap.
maxMessageSize = 200
# Streamlit Cloud defaults are fine for everything else; leaving them alone.

[browser]
# Disable usage telemetry collection (privacy + slightly faster boot).
gatherUsageStats = false
